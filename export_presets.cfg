[preset.0]

name="Web"
platform="Web"
runnable=true
export_filter="all_resources"
export_path="build/web/index.html"
include_filter="modules/tab_strip/assets/layout.json,modules/atlas/*.json,modules/video_player/assets/*/manifest.json,modules/video_player/assets/fonts/*.bytes"
exclude_filter="docs/*,build/*"

[preset.0.options]

variant/extensions_support=false
variant/thread_support=false
vram_texture_compression/for_desktop=false
vram_texture_compression/for_mobile=false
html/export_icon=false
html/canvas_resize_policy=2
html/focus_canvas_on_start=true

[preset.1]

name="Collection Filter Preview"
platform="Web"
runnable=false
export_filter="selected_resources"
export_path="build/web/filter-preview/index.html"
include_filter="prototypes/collection_filter_muse_preview/*,modules/collection_page/assets/muse-filter-frame.webp,modules/collection_page/assets/PixelMplus12-Regular.ttf"
exclude_filter="docs/*,build/*"

[preset.1.options]

application/run/main_scene="res://prototypes/collection_filter_muse_preview/preview.tscn"
variant/extensions_support=false
variant/thread_support=false
vram_texture_compression/for_desktop=false
vram_texture_compression/for_mobile=false
html/export_icon=false
html/canvas_resize_policy=2
html/focus_canvas_on_start=true
