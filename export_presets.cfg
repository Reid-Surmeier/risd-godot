[preset.0]

name="Web"
platform="Web"
runnable=true
export_filter="all_resources"
export_path="build/web/index.html"
include_filter="prototypes/painting-coverflow/web/paintings.json,modules/tab_strip/assets/layout.json,modules/atlas/*.json,modules/video_player/assets/*/manifest.json,modules/video_player/assets/fonts/*.bytes"
exclude_filter="docs/*,build/*"

[preset.0.options]

variant/extensions_support=false
variant/thread_support=false
vram_texture_compression/for_desktop=false
vram_texture_compression/for_mobile=false
html/export_icon=false
html/canvas_resize_policy=2
html/focus_canvas_on_start=true
