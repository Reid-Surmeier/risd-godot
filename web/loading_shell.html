<!DOCTYPE html>
<html lang="en">
	<head>
		<meta charset="utf-8">
		<meta name="viewport" content="width=device-width, user-scalable=no, initial-scale=1.0">
		<title>$GODOT_PROJECT_NAME</title>
		<style>
html, body, #canvas {
	margin: 0;
	padding: 0;
	border: 0;
}

body {
	background-color: #fefefe;
	overflow: hidden;
	touch-action: none;
}

#canvas {
	display: block;
}

#canvas:focus {
	outline: none;
}

/* Loading screen: the noise-dots shader on its own full-window canvas, over the game canvas. */
#status {
	position: absolute;
	inset: 0;
}

#status.no-webgl {
	background-color: #fefefe;
}

#status-shader {
	display: block;
	width: 100%;
	height: 100%;
}

#status-notice {
	display: none;
	position: absolute;
	left: 2rem;
	right: 2rem;
	top: 50%;
	transform: translateY(-50%);
	background-color: #5b3943;
	border-radius: 0.5rem;
	border: 1px solid #9b3943;
	color: #e0e0e0;
	font-family: 'Noto Sans', 'Droid Sans', Arial, sans-serif;
	line-height: 1.3;
	padding: 1rem;
	text-align: center;
}
		</style>
		$GODOT_HEAD_INCLUDE
	</head>
	<body>
		<canvas id="canvas">
			Your browser does not support the canvas tag.
		</canvas>

		<noscript>
			Your browser does not support JavaScript.
		</noscript>

		<div id="status">
			<canvas id="status-shader"></canvas>
			<div id="status-notice"></div>
		</div>

		<!-- The loading shader. Same as the Book of Shaders editor version, except the bar
		     reads the real download progress (u_progress) instead of a timed fake. -->
		<script id="loading-frag" type="x-shader/x-fragment">
precision mediump float;

uniform vec2 u_resolution;
uniform float u_time;
uniform float u_progress; // 0..1, bytes downloaded / total
uniform float u_exit;     // 0 while loading, then 0..1 over the exit: dots fly to the corners
uniform float u_exitTime; // u_time when the exit started (picks each dot's corner)

// Book of Shaders ch.10: random
float rand(float x) { return fract(sin(x) * 43758.5453123); }

// Book of Shaders ch.11: 1D value noise
float noise(float x) {
	float i = floor(x);
	float f = fract(x);
	return mix(rand(i), rand(i + 1.0), smoothstep(0.0, 1.0, f));
}

// rounded-rectangle distance (Inigo Quilez): < 0 inside, > 0 outside
float sdPill(vec2 p, vec2 halfSize) {
	float r = min(halfSize.x, halfSize.y);
	vec2 q = abs(p) - halfSize + r;
	return length(max(q, 0.0)) + min(max(q.x, q.y), 0.0) - r;
}

// Colors are premultiplied (rgb * alpha) so the game shows through as the screen fades out.
// Paint 'color' with coverage 'a' over what is there ("over" compositing).
vec4 over(vec4 dst, vec3 color, float a) {
	return dst * (1.0 - a) + vec4(color, 1.0) * a;
}

// one soft ring: strongest at 'ringR', paler in the middle, blurry outside
vec4 drawDot(vec4 col, vec2 st, vec2 pos, vec3 dotColor) {
	float d = length(st - pos);
	float a = exp(-pow((d - 0.0096) / 0.0112, 2.0));
	return over(col, dotColor, a);
}

// The loading screen itself at point st (premultiplied color).
vec4 scene(vec2 st) {
	float fade = 1.0 - smoothstep(0.15, 0.85, u_exit);  // background and bar fade out during the exit
	float fly = u_exit * u_exit * u_exit;              // ease-in: the dots leave slowly, then fast
	vec2 corner = vec2(0.5 * u_resolution.x / u_resolution.y, 0.5) * 1.3;  // just past each screen corner

	vec4 col = vec4(vec3(0.996), 1.0) * fade;          // background, sampled from the reference
	vec3 colors[4];                                    // ring colors, sampled from the reference
	colors[0] = vec3(0.98, 0.92, 0.58);                // yellow
	colors[1] = vec3(0.99, 0.65, 0.63);                // red
	colors[2] = vec3(0.67, 0.79, 0.96);                // blue
	colors[3] = vec3(0.83, 0.93, 0.63);                // green

	vec2 center = vec2(0.0, 0.064);                    // orbit center: whole group centered in the frame
	for (int i = 0; i < 4; i++) {
		float fi = float(i);
		float t = u_time * 0.8 + fi * 10.0;            // each dot reads a different stretch of noise
		float angle = u_time * 1.5 + fi * 1.5708       // base orbit, 90 degrees apart
					+ (noise(t) - 0.5) * 1.5;          // noise pushes it ahead / behind
		float radius = 0.066 + (noise(t + 50.0) - 0.5) * 0.04;  // noise breathes it in / out
		vec2 pos = center + radius * vec2(cos(angle), sin(angle));
		// each dot takes the corner of the quadrant its orbit slot was in when the exit began,
		// so the four always go to four different corners
		float q = floor(mod(u_exitTime * 1.5 + fi * 1.5708, 6.2832) / 1.5708);
		vec2 dir = vec2(q == 0.0 || q == 3.0 ? 1.0 : -1.0, q < 2.0 ? 1.0 : -1.0);
		pos = mix(pos, dir * corner, fly);
		col = drawDot(col, st, pos, colors[i]);
	}

	// progress bar: real download progress, starting as a small sliver
	float progress = mix(0.04, 1.0, clamp(u_progress, 0.0, 1.0));

	vec2 barCenter = vec2(-0.010, -0.410);
	vec2 barHalf = vec2(0.07, 0.0075);                // 0.14 wide, 0.015 tall
	vec2 b = st - barCenter;
	float track = sdPill(b, barHalf);
	float fillHalfW = barHalf.x * progress;
	float fill = sdPill(b - vec2(fillHalfW - barHalf.x, 0.0), vec2(fillHalfW, barHalf.y));
	// same gaussian falloff as the dots, but tighter (dots spread 0.0112) so the bar stays crisper
	float glow = 0.0045;
	col = over(col, vec3(0.975), exp(-pow(max(track, 0.0) / glow, 2.0)) * fade);        // track, soft edge
	col = over(col, vec3(0.885), exp(-pow(max(fill, 0.0) / glow, 2.0)) * fade);         // fill, soft edge
	col = over(col, vec3(0.92), exp(-pow(track / (glow * 0.5), 2.0)) * 0.5 * fade);     // diffused outline

	return col;
}

// Book of Shaders ch.11: 2D value noise, for the tape's soft mottle
float rand2(vec2 p) { return fract(sin(dot(p, vec2(12.9898, 78.233))) * 43758.5453123); }
float noise2(vec2 p) {
	vec2 i = floor(p);
	vec2 f = fract(p);
	vec2 u = f * f * (3.0 - 2.0 * f);
	return mix(mix(rand2(i), rand2(i + vec2(1.0, 0.0)), u.x),
			   mix(rand2(i + vec2(0.0, 1.0)), rand2(i + vec2(1.0, 1.0)), u.x), u.y);
}

// Brightness (Y) and color (I, Q) the way analog video carries them
vec3 toYIQ(vec3 c) { return mat3(0.299, 0.596, 0.211, 0.587, -0.274, -0.523, 0.114, -0.322, 0.312) * c; }
vec3 fromYIQ(vec3 c) { return mat3(1.0, 1.0, 1.0, 0.956, -0.272, -1.106, 0.621, -0.647, 1.703) * c; }

void main() {
	// centered, aspect-correct: (0,0) is the middle, 1.0 = canvas height
	vec2 st = (gl_FragCoord.xy - 0.5 * u_resolution) / u_resolution.y;
	vec2 px = vec2(1.0 / u_resolution.y, 0.0);        // one pixel to the right, in st units

	// Analog-video look, measured from the owner's reference capture (a VHS-style edit):
	// 1. brightness is a little soft sideways
	vec4 here = scene(st);
	vec4 luma = (scene(st - px) + 2.0 * here + scene(st + px)) * 0.25;
	// 2. color is carried at lower resolution and trails to the right of its shape
	vec4 chroma = vec4(0.0);
	for (int k = 0; k < 6; k++) {
		chroma += scene(st - px * float(k) * 1.5);
	}
	chroma /= 6.0;
	// 3. sharpening halo: dark edges get a light outline
	vec4 wide = (scene(st - 3.0 * px) + scene(st + 3.0 * px) + scene(st - 2.0 * px.yx) + scene(st + 2.0 * px.yx)) * 0.25;

	float a = max(luma.a, 1e-4);                       // work on straight (not premultiplied) color
	float y = toYIQ(luma.rgb / a).x;
	y += 0.35 * (y - toYIQ(wide.rgb / max(wide.a, 1e-4)).x);
	vec2 iq = toYIQ(chroma.rgb / max(chroma.a, 1e-4)).yz;
	vec3 rgb = fromYIQ(vec3(y, iq));

	// 4. whites sit at the reference's grey-green off-white, blacks lift slightly
	rgb = mix(vec3(0.06), vec3(0.898, 0.906, 0.894), rgb / 0.996);
	// 5. soft blotchy mottle (about 1%), drifting slowly, not flickering
	rgb += (noise2(st * vec2(5.0, 7.0) + vec2(u_time * 0.07, u_time * -0.04)) - 0.5) * 0.02;

	gl_FragColor = vec4(clamp(rgb, 0.0, 1.0) * luma.a, luma.a);
}
		</script>

		<script src="$GODOT_URL"></script>
		<script>
// The engine (.wasm) and game pack (.pck) are fetched as their .gz twins (scripts/export-web.sh
// makes them) and unzipped here, so any static host sends ~52 MB instead of ~88 without needing
// server-side compression. Falls back to the plain file if there is no twin or no DecompressionStream.
const plainFetch = window.fetch.bind(window);
window.fetch = async function (input, init) {
	const url = typeof input === 'string' ? input : input.url;
	if (/\.(wasm|pck)$/.test(url) && 'DecompressionStream' in window) {
		const gz = await plainFetch(url + '.gz', init).catch(() => null);
		if (gz && gz.ok && !gz.headers.get('Content-Encoding')) {
			const type = url.endsWith('.wasm') ? 'application/wasm' : 'application/octet-stream';
			return new Response(gz.body.pipeThrough(new DecompressionStream('gzip')), { headers: { 'Content-Type': type } });
		}
	}
	return plainFetch(input, init);
};

const GODOT_CONFIG = $GODOT_CONFIG;
const GODOT_THREADS_ENABLED = $GODOT_THREADS_ENABLED;
const engine = new Engine(GODOT_CONFIG);

// Runs the loading shader until exit() finishes. setProgress() takes the real download
// fraction; the bar eases toward it so cached (instant) loads still read as loading.
const loadingScreen = (function () {
	const canvas = document.getElementById('status-shader');
	const gl = canvas.getContext('webgl');
	let target = 0;
	let shown = 0;
	let exitStart = -1; // ms timestamp the exit began, -1 while loading
	const EXIT_MS = 1100;
	if (!gl) {
		document.getElementById('status').classList.add('no-webgl'); // plain off-white screen
		return { setProgress() {}, exit(done) { done(); } };
	}

	function compile(type, source) {
		const shader = gl.createShader(type);
		gl.shaderSource(shader, source);
		gl.compileShader(shader);
		if (!gl.getShaderParameter(shader, gl.COMPILE_STATUS)) {
			console.error(gl.getShaderInfoLog(shader));
		}
		return shader;
	}
	const program = gl.createProgram();
	gl.attachShader(program, compile(gl.VERTEX_SHADER, 'attribute vec2 a;void main(){gl_Position=vec4(a,0.0,1.0);}'));
	gl.attachShader(program, compile(gl.FRAGMENT_SHADER, document.getElementById('loading-frag').textContent));
	gl.linkProgram(program);
	gl.useProgram(program);
	gl.bindBuffer(gl.ARRAY_BUFFER, gl.createBuffer());
	gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1, -1, 3, -1, -1, 3]), gl.STATIC_DRAW); // one full-screen triangle
	gl.enableVertexAttribArray(0);
	gl.vertexAttribPointer(0, 2, gl.FLOAT, false, 0, 0);
	const uResolution = gl.getUniformLocation(program, 'u_resolution');
	const uTime = gl.getUniformLocation(program, 'u_time');
	const uProgress = gl.getUniformLocation(program, 'u_progress');
	const uExit = gl.getUniformLocation(program, 'u_exit');
	const uExitTime = gl.getUniformLocation(program, 'u_exitTime');
	const start = performance.now();
	let onExitDone = null;

	function frame(now) {
		const exit = exitStart < 0 ? 0 : Math.min((now - exitStart) / EXIT_MS, 1);
		if (exit >= 1) {
			onExitDone();
			return;
		}
		const w = Math.round(canvas.clientWidth * devicePixelRatio);
		const h = Math.round(canvas.clientHeight * devicePixelRatio);
		if (canvas.width !== w || canvas.height !== h) {
			canvas.width = w;
			canvas.height = h;
		}
		gl.viewport(0, 0, w, h);
		shown += (target - shown) * 0.08;
		gl.uniform2f(uResolution, w, h);
		gl.uniform1f(uTime, (now - start) / 1000);
		gl.uniform1f(uProgress, shown);
		gl.uniform1f(uExit, exit);
		gl.uniform1f(uExitTime, exitStart < 0 ? 0 : (exitStart - start) / 1000);
		gl.clearColor(0, 0, 0, 0);
		gl.clear(gl.COLOR_BUFFER_BIT);
		gl.drawArrays(gl.TRIANGLES, 0, 3);
		requestAnimationFrame(frame);
	}
	requestAnimationFrame(frame);

	return {
		setProgress(p) { target = Math.max(target, p); }, // never goes backwards
		// Dots fly to the corners while the screen fades to the game; done() runs at the end.
		exit(done) { onExitDone = done; exitStart = performance.now(); },
	};
}());

(function () {
	const statusOverlay = document.getElementById('status');
	const statusNotice = document.getElementById('status-notice');

	let initializing = true;

	function hideLoadingScreen() {
		if (!initializing) {
			return;
		}
		initializing = false;
		loadingScreen.setProgress(1);
		// Let the bar reach the end, then the dots fly out to the corners over the game.
		setTimeout(() => loadingScreen.exit(() => statusOverlay.remove()), 350);
	}

	function setStatusNotice(text) {
		while (statusNotice.lastChild) {
			statusNotice.removeChild(statusNotice.lastChild);
		}
		const lines = text.split('\n');
		lines.forEach((line) => {
			statusNotice.appendChild(document.createTextNode(line));
			statusNotice.appendChild(document.createElement('br'));
		});
	}

	function displayFailureNotice(err) {
		console.error(err);
		if (err instanceof Error) {
			setStatusNotice(err.message);
		} else if (typeof err === 'string') {
			setStatusNotice(err);
		} else {
			setStatusNotice('An unknown error occurred.');
		}
		statusNotice.style.display = 'block';
		initializing = false;
	}

	const missing = Engine.getMissingFeatures({
		threads: GODOT_THREADS_ENABLED,
	});

	if (missing.length !== 0) {
		if (GODOT_CONFIG['serviceWorker'] && GODOT_CONFIG['ensureCrossOriginIsolationHeaders'] && 'serviceWorker' in navigator) {
			let serviceWorkerRegistrationPromise;
			try {
				serviceWorkerRegistrationPromise = navigator.serviceWorker.getRegistration();
			} catch (err) {
				serviceWorkerRegistrationPromise = Promise.reject(new Error('Service worker registration failed.'));
			}
			// There's a chance that installing the service worker would fix the issue
			Promise.race([
				serviceWorkerRegistrationPromise.then((registration) => {
					if (registration != null) {
						return Promise.reject(new Error('Service worker already exists.'));
					}
					return registration;
				}).then(() => engine.installServiceWorker()),
				// For some reason, `getRegistration()` can stall
				new Promise((resolve) => {
					setTimeout(() => resolve(), 2000);
				}),
			]).then(() => {
				// Reload if there was no error.
				window.location.reload();
			}).catch((err) => {
				console.error('Error while registering service worker:', err);
			});
		} else {
			// Display the message as usual
			const missingMsg = 'Error\nThe following features required to run Godot projects on the Web are missing:\n';
			displayFailureNotice(missingMsg + missing.join('\n'));
		}
	} else {
		engine.startGame({
			'onProgress': function (current, total) {
				if (current > 0 && total > 0) {
					// Downloading is most of the wait; keep the last 10% for engine start-up.
					loadingScreen.setProgress(0.9 * current / total);
				}
			},
		}).then(hideLoadingScreen, displayFailureNotice);
	}
}());
		</script>
	</body>
</html>
