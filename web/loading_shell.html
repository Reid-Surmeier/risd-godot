<!DOCTYPE html>
<html lang="en">
	<head>
		<meta charset="utf-8">
		<meta name="viewport" content="width=device-width, user-scalable=no, initial-scale=1.0">
		<title>$GODOT_PROJECT_NAME</title>
		<style>
html, body, #canvas {
	margin: 0;
	padding: 0;
	border: 0;
}

body {
	background-color: #fefefe;
	overflow: hidden;
	touch-action: none;
}

#canvas {
	display: block;
}

#canvas:focus {
	outline: none;
}

/* Loading screen: the noise-dots shader on its own full-window canvas, over the game canvas. */
#status {
	position: absolute;
	inset: 0;
	background-color: #fefefe;
	transition: opacity 0.4s ease;
}

#status.done {
	opacity: 0;
}

#status-shader {
	display: block;
	width: 100%;
	height: 100%;
}

#status-notice {
	display: none;
	position: absolute;
	left: 2rem;
	right: 2rem;
	top: 50%;
	transform: translateY(-50%);
	background-color: #5b3943;
	border-radius: 0.5rem;
	border: 1px solid #9b3943;
	color: #e0e0e0;
	font-family: 'Noto Sans', 'Droid Sans', Arial, sans-serif;
	line-height: 1.3;
	padding: 1rem;
	text-align: center;
}
		</style>
		$GODOT_HEAD_INCLUDE
	</head>
	<body>
		<canvas id="canvas">
			Your browser does not support the canvas tag.
		</canvas>

		<noscript>
			Your browser does not support JavaScript.
		</noscript>

		<div id="status">
			<canvas id="status-shader"></canvas>
			<div id="status-notice"></div>
		</div>

		<!-- The loading shader while everything downloads. Once the engine runs,
		     modules/shell/boot_loader.gd takes over (same dots and tape look) from window.loaderHandoff
		     for the last stretch: mounting the game, loading it, warming up the tabs. -->
		<script id="loading-frag" type="x-shader/x-fragment">
precision mediump float;

uniform vec2 u_resolution;
uniform float u_time;
uniform float u_progress; // 0..1, bytes downloaded / total

// Book of Shaders ch.10: random
float rand(float x) { return fract(sin(x) * 43758.5453123); }

// Book of Shaders ch.11: 1D value noise
float noise(float x) {
	float i = floor(x);
	float f = fract(x);
	return mix(rand(i), rand(i + 1.0), smoothstep(0.0, 1.0, f));
}

// rounded-rectangle distance (Inigo Quilez): < 0 inside, > 0 outside
float sdPill(vec2 p, vec2 halfSize) {
	float r = min(halfSize.x, halfSize.y);
	vec2 q = abs(p) - halfSize + r;
	return length(max(q, 0.0)) + min(max(q.x, q.y), 0.0) - r;
}

// one soft ring: strongest at 'ringR', paler in the middle, blurry outside
vec3 drawDot(vec3 col, vec2 st, vec2 pos, vec3 dotColor) {
	float d = length(st - pos);
	float a = exp(-pow((d - 0.0096) / 0.0112, 2.0));
	return mix(col, dotColor, a);
}

// The loading screen itself at point st.
vec3 scene(vec2 st) {
	vec3 col = vec3(0.996);                            // background, sampled from the reference
	vec3 colors[4];                                    // ring colors, sampled from the reference
	colors[0] = vec3(0.98, 0.92, 0.58);                // yellow
	colors[1] = vec3(0.99, 0.65, 0.63);                // red
	colors[2] = vec3(0.67, 0.79, 0.96);                // blue
	colors[3] = vec3(0.83, 0.93, 0.63);                // green

	vec2 center = vec2(0.0, 0.064);                    // orbit center: whole group centered in the frame
	for (int i = 0; i < 4; i++) {
		float fi = float(i);
		float t = u_time * 0.8 + fi * 10.0;            // each dot reads a different stretch of noise
		float angle = u_time * 1.5 + fi * 1.5708       // base orbit, 90 degrees apart
					+ (noise(t) - 0.5) * 1.5;          // noise pushes it ahead / behind
		float radius = 0.066 + (noise(t + 50.0) - 0.5) * 0.04;  // noise breathes it in / out
		vec2 pos = center + radius * vec2(cos(angle), sin(angle));
		col = drawDot(col, st, pos, colors[i]);
	}

	// progress bar: real download progress, starting as a small sliver
	float progress = mix(0.04, 1.0, clamp(u_progress, 0.0, 1.0));

	vec2 barCenter = vec2(-0.010, -0.410);
	vec2 barHalf = vec2(0.07, 0.0075);                // 0.14 wide, 0.015 tall
	vec2 b = st - barCenter;
	float track = sdPill(b, barHalf);
	float fillHalfW = barHalf.x * progress;
	float fill = sdPill(b - vec2(fillHalfW - barHalf.x, 0.0), vec2(fillHalfW, barHalf.y));
	// same gaussian falloff as the dots, but tighter (dots spread 0.0112) so the bar stays crisper
	float glow = 0.0045;
	col = mix(col, vec3(0.975), exp(-pow(max(track, 0.0) / glow, 2.0)));         // track, soft edge
	col = mix(col, vec3(0.885), exp(-pow(max(fill, 0.0) / glow, 2.0)));          // fill, soft edge
	col = mix(col, vec3(0.92), exp(-pow(track / (glow * 0.5), 2.0)) * 0.5);      // diffused outline

	return col;
}

// Brightness (Y) and colour (I, Q) the way analog video carries them
vec3 toYIQ(vec3 c) { return mat3(0.299, 0.596, 0.211, 0.587, -0.274, -0.523, 0.114, -0.322, 0.312) * c; }
vec3 fromYIQ(vec3 c) { return mat3(1.0, 1.0, 1.0, 0.956, -0.272, -1.106, 0.621, -0.647, 1.703) * c; }

// The tape signal, the same pass as modules/shell/tape_screen.gdshader, at the tape's (small)
// resolution: brightness soft sideways, colour trailing right at lower resolution, edge halo.
void main() {
	// centered, aspect-correct: (0,0) is the middle, 1.0 = canvas height
	vec2 st = (gl_FragCoord.xy - 0.5 * u_resolution) / u_resolution.y;
	vec2 px = vec2(1.0 / u_resolution.y, 0.0);        // one tape pixel sideways
	vec3 luma = (scene(st - px) + 2.0 * scene(st) + scene(st + px)) * 0.25;
	vec3 chroma = vec3(0.0);
	for (int k = 0; k < 5; k++) {
		chroma += scene(st - px * float(k) * 0.75);
	}
	chroma /= 5.0;
	vec3 wide = (scene(st - 2.0 * px) + scene(st + 2.0 * px) + scene(st - 2.0 * px.yx) + scene(st + 2.0 * px.yx)) * 0.25;
	float y = toYIQ(luma).x;
	y += 0.25 * (y - toYIQ(wide).x);                   // edge halo
	gl_FragColor = vec4(clamp(fromYIQ(vec3(y, toYIQ(chroma).yz)), 0.0, 1.0), 1.0);
}
		</script>

		<script src="$GODOT_URL"></script>
		<script>
// The engine (.wasm), the boot pack (.pck) and the game pack (.game.pck) are fetched as their .gz
// twins (scripts/export-web.sh makes them) and unzipped by the browser as they stream in, so any
// static host sends ~52 MB instead of ~88 and Godot's main thread never unzips anything. The
// compressed bytes are counted as they arrive: that count is the loading bar. Falls back to the
// plain file if there is no twin or no DecompressionStream.
const DOWNLOAD_COUNT = 2; // the engine and the game pack; the 10 KB boot pack is fetched later, by startGame
const downloads = {}; // url -> [bytes received, bytes total] of the compressed file
function downloadProgress() {
	const d = Object.values(downloads);
	let got = 0, total = 0;
	for (const [a, b] of d) { got += a; total += b; }
	return d.length < DOWNLOAD_COUNT || !total ? 0 : got / total;
}
const plainFetch = window.fetch.bind(window);
window.fetch = async function (input, init) {
	const url = typeof input === 'string' ? input : input.url;
	if (/\.(wasm|pck)$/.test(url) && 'DecompressionStream' in window) {
		const gz = await plainFetch(url + '.gz', init).catch(() => null);
		if (gz && gz.ok && !gz.headers.get('Content-Encoding')) {
			const entry = downloads[url] = [0, Number(gz.headers.get('Content-Length')) || 0];
			const counted = gz.body.pipeThrough(new TransformStream({
				transform(chunk, controller) { entry[0] += chunk.byteLength; controller.enqueue(chunk); },
			}));
			const type = url.endsWith('.wasm') ? 'application/wasm' : 'application/octet-stream';
			return new Response(counted.pipeThrough(new DecompressionStream('gzip')), { headers: { 'Content-Type': type } });
		}
	}
	return plainFetch(input, init);
};

const GODOT_CONFIG = $GODOT_CONFIG;
const GODOT_THREADS_ENABLED = $GODOT_THREADS_ENABLED;
const engine = new Engine(GODOT_CONFIG);

// Runs the loading shader until stop() is called. setProgress() takes the real download
// fraction; the bar eases toward it so cached (instant) loads still read as loading.
// The tape look, as in modules/shell/boot_loader.gd: the shader draws into a canvas 1/1.6 of the
// window's pixels (real pixel reduction), and 12 times a second that frame is JPEG-encoded and
// decoded (real block artifacts) onto the visible canvas, scaled up smoothly.
const PIXEL_REDUCTION = 1.6; // same values as boot_loader.gd
const TAPE_FPS = 12;
const JPEG_QUALITY = 0.7;
const MIN_SECONDS = 4; // the bar fills at a steady pace, never faster than empty-to-full in this
                       // long, so a quick load still reads as loading (same pace in boot_loader.gd)
const loadingScreen = (function () {
	const screen = document.getElementById('status-shader');
	const screen2d = screen.getContext('2d');
	const canvas = document.createElement('canvas');
	const gl = canvas.getContext('webgl', { preserveDrawingBuffer: true });
	let tapeFrame = null;  // the latest decoded JPEG
	let lastNow = null;
	let lastTape = -1e9;
	let encoding = false;
	let target = 0;
	let shown = 0;
	let running = !!gl;
	if (!gl) {
		return { setProgress() {}, stop() {} }; // no WebGL: plain off-white screen
	}

	function compile(type, source) {
		const shader = gl.createShader(type);
		gl.shaderSource(shader, source);
		gl.compileShader(shader);
		if (!gl.getShaderParameter(shader, gl.COMPILE_STATUS)) {
			console.error(gl.getShaderInfoLog(shader));
		}
		return shader;
	}
	const program = gl.createProgram();
	gl.attachShader(program, compile(gl.VERTEX_SHADER, 'attribute vec2 a;void main(){gl_Position=vec4(a,0.0,1.0);}'));
	gl.attachShader(program, compile(gl.FRAGMENT_SHADER, document.getElementById('loading-frag').textContent));
	gl.linkProgram(program);
	gl.useProgram(program);
	gl.bindBuffer(gl.ARRAY_BUFFER, gl.createBuffer());
	gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1, -1, 3, -1, -1, 3]), gl.STATIC_DRAW); // one full-screen triangle
	gl.enableVertexAttribArray(0);
	gl.vertexAttribPointer(0, 2, gl.FLOAT, false, 0, 0);
	const uResolution = gl.getUniformLocation(program, 'u_resolution');
	const uTime = gl.getUniformLocation(program, 'u_time');
	const uProgress = gl.getUniformLocation(program, 'u_progress');
	const start = performance.now();

	function frame(now) {
		if (!running) {
			return;
		}
		const W = Math.round(screen.clientWidth * devicePixelRatio);
		const H = Math.round(screen.clientHeight * devicePixelRatio);
		if (screen.width !== W || screen.height !== H) {
			screen.width = W;
			screen.height = H;
		}
		const w = Math.max(64, Math.round(W / PIXEL_REDUCTION));
		const h = Math.max(36, Math.round(H / PIXEL_REDUCTION));
		if (canvas.width !== w || canvas.height !== h) {
			canvas.width = w;
			canvas.height = h;
		}
		gl.viewport(0, 0, w, h);
		const dt = lastNow === null ? 0 : (now - lastNow) / 1000;
		lastNow = now;
		shown = Math.min(target, shown + dt / MIN_SECONDS);
		gl.uniform2f(uResolution, w, h);
		gl.uniform1f(uTime, (now - start) / 1000);
		gl.uniform1f(uProgress, shown);
		window.loaderHandoff = { t: (now - start) / 1000, progress: shown }; // read by boot_loader.gd
		window.loaderProgress = shown; // for modules/shell/playtest/perf_web.py
		gl.drawArrays(gl.TRIANGLES, 0, 3);
		if (now - lastTape >= 1000 / TAPE_FPS && !encoding) {
			lastTape = now;
			encoding = true;
			canvas.toBlob((blob) => {
				createImageBitmap(blob).then((bitmap) => { tapeFrame = bitmap; }).finally(() => { encoding = false; });
			}, 'image/jpeg', JPEG_QUALITY);
		}
		screen2d.imageSmoothingEnabled = true; // the soft upscale of a low-res signal
		screen2d.drawImage(tapeFrame || canvas, 0, 0, W, H);
		requestAnimationFrame(frame);
	}
	requestAnimationFrame(frame);

	return {
		setProgress(p) { target = Math.max(target, p); }, // never goes backwards
		stop() { running = false; },
	};
}());

(function () {
	const statusOverlay = document.getElementById('status');
	const statusNotice = document.getElementById('status-notice');

	let initializing = true;

	function hideLoadingScreen() {
		if (!initializing) {
			return;
		}
		initializing = false;
		// The Godot loading scene is drawing the same dots now: fade over to it.
		statusOverlay.classList.add('done');
		setTimeout(() => {
			loadingScreen.stop();
			statusOverlay.remove();
		}, 400);
	}

	function setStatusNotice(text) {
		while (statusNotice.lastChild) {
			statusNotice.removeChild(statusNotice.lastChild);
		}
		const lines = text.split('\n');
		lines.forEach((line) => {
			statusNotice.appendChild(document.createTextNode(line));
			statusNotice.appendChild(document.createElement('br'));
		});
	}

	function displayFailureNotice(err) {
		console.error(err);
		if (err instanceof Error) {
			setStatusNotice(err.message);
		} else if (typeof err === 'string') {
			setStatusNotice(err);
		} else {
			setStatusNotice('An unknown error occurred.');
		}
		statusNotice.style.display = 'block';
		initializing = false;
	}

	const missing = Engine.getMissingFeatures({
		threads: GODOT_THREADS_ENABLED,
	});

	if (missing.length !== 0) {
		if (GODOT_CONFIG['serviceWorker'] && GODOT_CONFIG['ensureCrossOriginIsolationHeaders'] && 'serviceWorker' in navigator) {
			let serviceWorkerRegistrationPromise;
			try {
				serviceWorkerRegistrationPromise = navigator.serviceWorker.getRegistration();
			} catch (err) {
				serviceWorkerRegistrationPromise = Promise.reject(new Error('Service worker registration failed.'));
			}
			// There's a chance that installing the service worker would fix the issue
			Promise.race([
				serviceWorkerRegistrationPromise.then((registration) => {
					if (registration != null) {
						return Promise.reject(new Error('Service worker already exists.'));
					}
					return registration;
				}).then(() => engine.installServiceWorker()),
				// For some reason, `getRegistration()` can stall
				new Promise((resolve) => {
					setTimeout(() => resolve(), 2000);
				}),
			]).then(() => {
				// Reload if there was no error.
				window.location.reload();
			}).catch((err) => {
				console.error('Error while registering service worker:', err);
			});
		} else {
			// Display the message as usual
			const missingMsg = 'Error\nThe following features required to run Godot projects on the Web are missing:\n';
			displayFailureNotice(missingMsg + missing.join('\n'));
		}
	} else {
		// The downloads are 85% of the bar; the Godot loading scene does the last 15%.
		const progressTimer = setInterval(() => loadingScreen.setProgress(0.85 * downloadProgress()), 100);
		// The game pack downloads alongside the engine and lands in Godot's file system before the
		// engine starts; boot_loader.gd mounts it from there.
		const exe = GODOT_CONFIG['executable'];
		Promise.all([engine.init(exe), engine.preloadFile(`${exe}.game.pck`, '/tmp/game.pck')]).then(() => {
			clearInterval(progressTimer);
			loadingScreen.setProgress(0.85);
			(window.loadPerf = window.loadPerf || []).push({ name: 'downloads-done', t: performance.now() });
			return engine.startGame({});
		}).then(() => {
			(window.loadPerf = window.loadPerf || []).push({ name: 'engine-started', t: performance.now() });
			hideLoadingScreen();
		}, displayFailureNotice);
	}
}());
		</script>
	</body>
</html>
