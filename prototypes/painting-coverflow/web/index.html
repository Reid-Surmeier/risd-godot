<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>RISD Painting Viewer</title>
<style>
*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;background:#e4e8ed;color:#263440;font:15px system-ui,sans-serif}main{width:min(1500px,97vw);margin:32px auto}.window{position:relative;border:solid transparent;border-width:clamp(64px,7.3vw,108px) 20px 22px 20px;border-image:url(assets/window.png) 140 67 40 40 stretch;background:white;filter:drop-shadow(0 14px 20px #263b4c25)}.interior{position:relative;background:white}.gallery{position:relative;height:clamp(310px,34vw,510px);overflow:hidden;background:#fff;touch-action:pan-y;cursor:grab;outline-offset:-4px;user-select:none}.gallery:active{cursor:grabbing}.scene{position:absolute;inset:0;perspective:1500px;perspective-origin:50% calc(100% - 58px);transform-style:preserve-3d}.painting{position:absolute;bottom:58px;left:50%;margin:0;padding:0;border:0;background:transparent;transform-style:preserve-3d;cursor:pointer;will-change:transform;transform-origin:50% 100%;outline-offset:6px}.painting img{display:block;width:100%;height:100%;object-fit:contain;pointer-events:none;user-select:none;backface-visibility:hidden;box-shadow:0 0 0 1px #0000000c}.painting[aria-current=true]{cursor:zoom-in}.painting::after{content:"";position:absolute;left:2%;width:96%;height:30px;bottom:-32px;border-radius:50%;background:radial-gradient(ellipse,#0005 0%,#0002 38%,transparent 73%);filter:blur(8px);transform:rotateX(55deg);pointer-events:none}.painting:focus-visible{outline:3px solid #397ab5}.info{text-align:center;padding:0 24px 14px;min-height:70px}.info h1{margin:0 0 5px;font:500 clamp(16px,1.6vw,23px) Georgia,serif}.info p{margin:0;color:#667581;font-size:13px}.controls{display:flex;align-items:center;gap:15px;max-width:760px;margin:0 auto;padding:0 25px 17px}.controls button,.close{border:1px solid #718da4;border-radius:5px;background:linear-gradient(#fcffff,#c6d8e8);box-shadow:inset 0 1px white;color:#264363;font:inherit;padding:4px 13px;cursor:pointer}.controls button:disabled{opacity:.4;cursor:default}input[type=range]{width:100%;accent-color:#4b709e;cursor:ew-resize}button:focus-visible,input:focus-visible,a:focus-visible{outline:3px solid #3d82b6;outline-offset:3px}.position{font-size:12px;white-space:nowrap;color:#647685;font-variant-numeric:tabular-nums}.caption{display:flex;justify-content:space-between;gap:20px;padding:18px 9px;color:#586b7a;font-size:12px}.caption p{margin:0}.caption a{color:inherit;text-underline-offset:3px}.notice{text-align:center;padding:40px;color:#50697e}.notice button{font:inherit}.gallery[data-loading=true]{display:grid;place-items:center}dialog{border:0;border-radius:9px;padding:18px;max-width:94vw;max-height:94vh;background:#f8fafc;box-shadow:0 20px 70px #0006}dialog::backdrop{background:#152838b3;backdrop-filter:blur(5px)}.detail-head{display:flex;align-items:start;gap:30px;justify-content:space-between;margin-bottom:12px}.detail-head h2{font:500 22px Georgia,serif;margin:0 0 6px}.detail-head p{margin:0;color:#607181}.close{font-size:23px;line-height:1;padding:5px 10px}#large-image{display:block;max-width:85vw;max-height:70vh;width:auto;height:auto;margin:auto;object-fit:contain}.detail-footer{display:flex;justify-content:space-between;align-items:center;gap:20px;font-size:12px;color:#586b7a;margin-top:13px}.detail-footer a{color:#254e77}#open{border:0;background:none;color:#365e88;text-decoration:underline;cursor:pointer;font:inherit}.empty{font-size:14px;text-align:center;padding:10px}footer a{color:#40617b}
@media(max-width:600px){main{width:96vw;margin:18px auto}.window{border-width:57px 12px 15px}.gallery{height:355px}.info{min-height:85px;padding:0 14px 14px}.info h1{font-size:18px}.controls{padding:0 12px 12px;gap:9px}.controls button{padding:5px 10px}.caption{flex-direction:column;gap:8px;font-size:11px}.painting::after{height:22px;bottom:-26px}dialog{padding:12px}.detail-head h2{font-size:19px}.detail-footer{align-items:start;flex-direction:column;gap:8px}}
@media(prefers-reduced-motion:reduce){*{scroll-behavior:auto!important}}
</style></head><body><main>
<section class="window" aria-label="RISD painting viewer"><div class="interior">
<div id="stage" class="gallery" tabindex="0" role="region" aria-roledescription="carousel" aria-label="Paintings. Use left and right arrow keys, scroll, or drag." data-loading="true"><div class="scene" id="scene"></div><p id="loading" class="notice">Loading paintings…</p></div>
<div class="info" aria-live="polite" aria-atomic="true"><h1 id="title">RISD Museum</h1><p><span id="artist"></span> <button id="open" hidden>View painting</button></p></div>
<div class="controls"><button id="previous" aria-label="Previous painting" disabled>‹</button><input id="scrubber" aria-label="Choose painting" type="range" min="0" max="0" value="0" step="1" disabled><button id="next" aria-label="Next painting" disabled>›</button><span class="position" id="position"></span></div>
</div></section>
<footer class="caption"><p>Scroll or drag to browse · ← → to move · Click the center painting to open</p><p>Collection images: <a id="museum-link" href="https://risdmuseum.org/art-design/collection" target="_blank" rel="noopener">RISD Museum</a> · <a href="https://www.youtube.com/watch?v=9RIJhdY6134&t=263s" target="_blank" rel="noopener">Motion reference</a></p></footer>
<dialog id="detail" aria-labelledby="detail-title"><div class="detail-head"><div><h2 id="detail-title"></h2><p id="detail-artist"></p></div><button class="close" id="close" aria-label="Close painting">×</button></div><img id="large-image" alt=""><div class="detail-footer"><span>Collection of the RISD Museum, Providence, RI.</span><a id="detail-link" target="_blank" rel="noopener">View museum record ↗</a></div></dialog>
</main><script type="module" src="viewer.js"></script></body></html>
