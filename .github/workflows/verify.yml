name: Verify

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Map, seams, GDScript lint, tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Install gdtoolkit
        run: pipx install "gdtoolkit==4.*" || pip install "gdtoolkit==4.*"
      - name: Install image check dependency
        run: python3 -m pip install Pillow
      - run: scripts/check.sh
      - run: git diff --check
